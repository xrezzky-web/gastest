<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - XREZZKY STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #080c14; --sf: #0e1520; --sf2: #131c2e;
            --bd: rgba(255,255,255,.07); --bl: #3b82f6; --yw: #f59e0b; --gr: #10b981;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: #f1f5f9;
            min-height: 100vh;
        }
        .glass { background: rgba(14,21,32,0.92); backdrop-filter: blur(16px); border: 1px solid var(--bd); }
        .inp { width:100%; padding:14px; border-radius:12px; background:var(--sf2); border:1px solid var(--bd); color:#f1f5f9; }
        .inp:focus { border-color: var(--bl); outline: none; }
        .btn { padding:12px 20px; border-radius:12px; font-weight:700; cursor:pointer; transition: all 0.2s; }
        .bp { background:var(--bl); color:white; }
        .by { background:var(--yw); color:black; }
        .bg { background:var(--gr); color:white; }
        .tab-active { border-bottom: 3px solid var(--bl); color: white; font-weight: 600; }
        .toast { animation: slideUp 0.3s ease forwards; }
        @keyframes slideUp { from { transform: translateY(100%); opacity:0; } to { transform: translateY(0); opacity:1; } }
    </style>
</head>
<body class="pb-20">

<div id="loading" class="fixed inset-0 bg-[#080c14] flex flex-col items-center justify-center z-50">
    <div style="font-family:'Syne',sans-serif;" class="text-4xl font-bold mb-6 text-blue-400">Seller Dashboard</div>
    <div class="w-48 h-1 bg-gray-800 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-blue-500 transition-all duration-1000" style="width:0%"></div>
    </div>
</div>

<div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 style="font-family:'Syne',sans-serif;" class="text-3xl font-bold">Seller Dashboard</h1>
            <p id="storeName" class="text-gray-400">Memuat...</p>
        </div>
        <button onclick="logoutSeller()" class="btn border border-red-500 text-red-400 hover:bg-red-500/10">Logout</button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-4 mb-8">
        <div class="glass p-5 rounded-2xl text-center">
            <p class="text-xs text-gray-400">Total Produk</p>
            <p id="stat-products" class="text-3xl font-bold text-blue-400">0</p>
        </div>
        <div class="glass p-5 rounded-2xl text-center">
            <p class="text-xs text-gray-400">Total Terjual</p>
            <p id="stat-sold" class="text-3xl font-bold text-green-400">0</p>
        </div>
        <div class="glass p-5 rounded-2xl text-center">
            <p class="text-xs text-gray-400">Rating Toko</p>
            <p id="stat-rating" class="text-3xl font-bold text-yellow-400">0.0</p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-white/10 mb-6 overflow-x-auto">
        <button onclick="switchTab(0)" class="tab px-6 py-3 tab-active" id="tab-0">📦 Produk Saya</button>
        <button onclick="switchTab(1)" class="tab px-6 py-3" id="tab-1">📋 Pesanan Masuk</button>
        <button onclick="switchTab(2)" class="tab px-6 py-3" id="tab-2">➕ Tambah Produk</button>
        <button onclick="switchTab(3)" class="tab px-6 py-3" id="tab-3">🏪 Info Toko</button>
    </div>

    <!-- Tab Content -->
    <div id="tab-content-0" class="tab-content">
        <div id="productList" class="space-y-4"></div>
    </div>

    <div id="tab-content-1" class="tab-content hidden">
        <div id="orderList" class="space-y-4"></div>
    </div>

    <div id="tab-content-2" class="tab-content hidden">
        <div class="glass p-6 rounded-3xl">
            <h3 class="font-bold mb-6 text-lg">Tambah / Edit Produk</h3>
            <input id="prodName" type="text" placeholder="Nama Produk *" class="inp mb-3">
            <input id="prodPrice" type="number" placeholder="Harga (Rp) *" class="inp mb-3">
            <input id="prodStock" type="number" placeholder="Stok *" class="inp mb-3">
            <input id="prodCategory" type="text" placeholder="Kategori (contoh: Fashion, Elektronik)" class="inp mb-3">
            <textarea id="prodDesc" placeholder="Deskripsi produk" class="inp h-24 mb-4"></textarea>
            <input id="prodImage" type="text" placeholder="URL Gambar (https://...)" class="inp mb-4">
            <button onclick="saveProduct()" class="btn bg w-full py-4 text-lg">Simpan Produk</button>
        </div>
    </div>

    <div id="tab-content-3" class="tab-content hidden">
        <div id="storeInfo" class="glass p-6 rounded-3xl"></div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 hidden bg-gray-800 border border-gray-700 text-white px-6 py-3 rounded-2xl shadow-2xl toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA75bdcfawOi957by8y_4-l4sJCCo6pF88",
        authDomain: "xrezzkystore-marketplace-83bc0.firebaseapp.com",
        databaseURL: "https://xrezzkystore-marketplace-83bc0-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "xrezzkystore-marketplace-83bc0",
        storageBucket: "xrezzkystore-marketplace-83bc0.firebasestorage.app",
        messagingSenderId: "604900856944",
        appId: "1:604900856944:web:c48c973da45214c68a10b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let sellerData = null;
    let products = [];
    let orders = [];
    let currentEditProductId = null;

    // Toast Notification
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.remove('hidden', 'bg-green-600', 'bg-red-600');
        
        if (type === 'success') toast.classList.add('bg-green-600');
        else if (type === 'error') toast.classList.add('bg-red-600');
        
        setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    // Loading
    function simulateLoading() {
        const progress = document.getElementById('progressBar');
        let width = 0;
        const interval = setInterval(() => {
            width += Math.random() * 25;
            if (width > 95) width = 95;
            progress.style.width = width + '%';
        }, 80);

        setTimeout(() => {
            clearInterval(interval);
            progress.style.width = '100%';
            setTimeout(() => document.getElementById('loading').remove(), 300);
        }, 1200);
    }

    // Switch Tab
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`tab-content-${tab}`).classList.remove('hidden');

        document.querySelectorAll('.tab').forEach(el => el.classList.remove('tab-active'));
        document.getElementById(`tab-${tab}`).classList.add('tab-active');
    };

    // Load Seller Data
    function loadSellerData() {
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;

            // Load Seller Info
            onValue(ref(db, 'sellers/' + user.uid), (snap) => {
                if (snap.exists()) {
                    sellerData = snap.val();
                    document.getElementById('storeName').textContent = sellerData.storeName || 'Toko Saya';
                    loadStoreInfo();
                } else {
                    document.getElementById('storeName').textContent = 'Toko Belum Diatur';
                }
            });

            // Load Products
            onValue(ref(db, 'products'), (snap) => {
                products = [];
                if (snap.exists()) {
                    snap.forEach(child => {
                        const p = child.val();
                        if (p.sellerId === user.uid) {
                            products.push({ id: child.key, ...p });
                        }
                    });
                }
                renderSellerProducts();
                updateStats();
            });

            // Load Orders
            onValue(ref(db, 'orders'), (snap) => {
                orders = [];
                if (snap.exists()) {
                    snap.forEach(child => {
                        const o = child.val();
                        if (o.sellerId === user.uid) {
                            orders.push({ id: child.key, ...o });
                        }
                    });
                }
                renderOrders();
            });
        });
    }

    function renderSellerProducts() {
        const container = document.getElementById('productList');
        container.innerHTML = products.length === 0 
            ? `<p class="text-center text-gray-400 py-10">Belum ada produk. Tambahkan produk baru di tab "Tambah Produk".</p>`
            : '';

        products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'glass p-4 rounded-2xl flex gap-4 items-center';
            div.innerHTML = `
                <img src="${p.images && p.images[0] ? p.images[0] : 'https://placehold.co/80x80/1a2333/64748b?text=No+Img'}" 
                     class="w-20 h-20 object-cover rounded-xl flex-shrink-0">
                <div class="flex-1 min-w-0">
                    <p class="font-medium truncate">${p.name}</p>
                    <p class="text-blue-400">Rp ${Number(p.price || 0).toLocaleString('id-ID')}</p>
                    <p class="text-xs text-gray-400">Stok: ${p.stock || 0}</p>
                </div>
                <div class="flex flex-col gap-2">
                    <button onclick="editProduct('${p.id}')" class="btn border border-yellow-400 text-yellow-400 text-xs px-4 py-1">Edit</button>
                    <button onclick="deleteProduct('${p.id}')" class="btn border border-red-500 text-red-400 text-xs px-4 py-1">Hapus</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function renderOrders() {
        const container = document.getElementById('orderList');
        container.innerHTML = orders.length === 0 
            ? `<p class="text-center text-gray-400 py-10">Belum ada pesanan masuk.</p>`
            : '';

        orders.forEach(order => {
            const div = document.createElement('div');
            div.className = 'glass p-5 rounded-2xl';
            div.innerHTML = `
                <div class="flex justify-between mb-3">
                    <span class="font-mono text-sm">${order.orderId || order.id}</span>
                    <span class="px-3 py-1 text-xs rounded-full ${order.status === 'completed' ? 'bg-green-500/20 text-green-400' : order.status === 'rejected' ? 'bg-red-500/20 text-red-400' : 'bg-yellow-500/20 text-yellow-400'}">
                        ${order.status || 'pending'}
                    </span>
                </div>
                <p class="font-medium">${order.userName || 'Pembeli'}</p>
                <p class="text-sm text-gray-400 mt-1">
                    \( {order.items ? order.items.map(i => ` \){i.name} ×${i.qty}`).join(', ') : 'Tidak ada item'}
                </p>
                <p class="text-blue-400 font-bold mt-3">Rp ${Number(order.total || 0).toLocaleString('id-ID')}</p>
                
                <div class="mt-4">
                    <select onchange="updateOrderStatus('${order.id}', this.value)" class="inp text-sm py-2">
                        <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="processed" ${order.status === 'processed' ? 'selected' : ''}>Diproses</option>
                        <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Dikirim</option>
                        <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Selesai</option>
                        <option value="rejected" ${order.status === 'rejected' ? 'selected' : ''}>Tolak</option>
                    </select>
                </div>
            `;
            container.appendChild(div);
        });
    }

    window.updateOrderStatus = async (orderId, status) => {
        try {
            await update(ref(db, 'orders/' + orderId), { status });
            showToast(`Status pesanan diubah menjadi ${status}`, 'success');
        } catch (e) {
            console.error(e);
            showToast('Gagal mengubah status', 'error');
        }
    };

    function loadStoreInfo() {
        const el = document.getElementById('storeInfo');
        if (!sellerData) return;
        el.innerHTML = `
            <h3 class="font-bold mb-4 text-lg">Info Toko</h3>
            <div class="space-y-2">
                <p><strong>Nama Toko:</strong> ${sellerData.storeName || '-'}</p>
                <p><strong>Kota:</strong> ${sellerData.city || '-'}</p>
                <p><strong>WhatsApp:</strong> ${sellerData.whatsapp || '-'}</p>
                <p class="text-sm text-gray-400 mt-4">${sellerData.description || 'Tidak ada deskripsi.'}</p>
            </div>
        `;
    }

    window.saveProduct = async () => {
        const name = document.getElementById('prodName').value.trim();
        const price = parseInt(document.getElementById('prodPrice').value);
        const stock = parseInt(document.getElementById('prodStock').value);
        const category = document.getElementById('prodCategory').value.trim();
        const desc = document.getElementById('prodDesc').value.trim();
        const imageUrl = document.getElementById('prodImage').value.trim();

        if (!name || isNaN(price) || isNaN(stock) || price <= 0 || stock < 0) {
            showToast('Nama, harga (>0), dan stok wajib diisi dengan benar', 'error');
            return;
        }

        const productData = {
            name,
            price,
            stock,
            category: category || 'Lainnya',
            description: desc,
            images: imageUrl ? [imageUrl] : [],
            sellerId: currentUser.uid,
            sellerName: sellerData ? sellerData.storeName : 'Toko Saya',
            updatedAt: Date.now()
        };

        try {
            if (currentEditProductId) {
                await update(ref(db, 'products/' + currentEditProductId), productData);
                showToast('Produk berhasil diperbarui', 'success');
            } else {
                await push(ref(db, 'products'), productData);
                showToast('Produk berhasil ditambahkan', 'success');
            }
            switchTab(0);
            clearProductForm();
        } catch (e) {
            console.error(e);
            showToast('Gagal menyimpan produk', 'error');
        }
    };

    function clearProductForm() {
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodStock').value = '';
        document.getElementById('prodCategory').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodImage').value = '';
        currentEditProductId = null;
    }

    window.editProduct = (id) => {
        const p = products.find(prod => prod.id === id);
        if (!p) return showToast('Produk tidak ditemukan', 'error');

        currentEditProductId = id;
        document.getElementById('prodName').value = p.name || '';
        document.getElementById('prodPrice').value = p.price || '';
        document.getElementById('prodStock').value = p.stock || '';
        document.getElementById('prodCategory').value = p.category || '';
        document.getElementById('prodDesc').value = p.description || '';
        document.getElementById('prodImage').value = p.images && p.images[0] ? p.images[0] : '';
        switchTab(2);
    };

    window.deleteProduct = async (id) => {
        if (!confirm('Yakin ingin menghapus produk ini?')) return;
        try {
            await remove(ref(db, 'products/' + id));
            showToast('Produk berhasil dihapus', 'success');
        } catch (e) {
            console.error(e);
            showToast('Gagal menghapus produk', 'error');
        }
    };

    function updateStats() {
        document.getElementById('stat-products').textContent = products.length;
        // Total terjual bisa dikembangkan nanti dari orders
        document.getElementById('stat-sold').textContent = '0';
    }

    window.logoutSeller = async () => {
        try {
            await signOut(auth);
            window.location.href = 'index.html';
        } catch (e) {
            showToast('Gagal logout', 'error');
        }
    };

    // Inisialisasi
    simulateLoading();
    loadSellerData();
</script>
</body>
</html>
