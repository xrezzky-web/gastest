<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Konfirmasi Seller</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --success: #22c55e; --danger: #ef4444; --dark: #0f172a; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { 
            background: var(--dark); color: white; padding: 20px 30px; 
            border-radius: 15px; margin-bottom: 30px; display: flex; 
            justify-content: space-between; align-items: center;
        }

        .card { background: white; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; color: #475569; text-align: left; padding: 15px; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; }

        /* Status Badges */
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .pending { background: #fef9c3; color: #854d0e; }
        .approved { background: #dcfce7; color: #166534; }

        /* Action Buttons */
        .btn { border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.8rem; }
        .btn-approve { background: var(--success); color: white; margin-right: 5px; }
        .btn-approve:hover { opacity: 0.8; }
        .btn-delete { background: var(--danger); color: white; }
        
        .empty-msg { padding: 40px; text-align: center; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size:1.4rem;">🛡️ Admin Dashboard</h1>
            <p style="margin:5px 0 0; font-size:0.8rem; opacity:0.7;">Verifikasi Pendaftaran Seller</p>
        </div>
        <a href="index.html" style="color:white; text-decoration:none; font-size:0.9rem;">Ke Halaman Utama →</a>
    </header>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Nama Toko</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="4" class="empty-msg">Memverifikasi akses admin...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Proteksi Admin (Ganti 'admin123' sesuai keinginan lu)
    const access = prompt("Masukkan Password Admin:");
    if (access !== "admin123") {
        alert("Akses Ditolak!");
        window.location.href = "index.html";
    }

    const firebaseConfig = {
        apiKey: "AIzaSyA75bdcfawOi957by8y_4-l4sJCCo6pF88",
        authDomain: "xrezzkystore-marketplace-83bc0.firebaseapp.com",
        databaseURL: "https://xrezzkystore-marketplace-83bc0-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "xrezzkystore-marketplace-83bc0",
        storageBucket: "xrezzkystore-marketplace-83bc0.firebasestorage.app",
        messagingSenderId: "604900856944",
        appId: "1:604900856944:web:c48c973da45214c68a10b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tableBody = document.getElementById('table-body');

    // Load Data Seller Registrations
    const regRef = ref(db, 'registrations');
    onValue(regRef, (snapshot) => {
        const data = snapshot.val();
        tableBody.innerHTML = '';

        if (data) {
            Object.keys(data).forEach(key => {
                const seller = data[key];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${seller.storeName}</strong></td>
                    <td>${seller.email}</td>
                    <td><span class="badge ${seller.status}">${seller.status.toUpperCase()}</span></td>
                    <td>
                        ${seller.status === 'pending' ? 
                            `<button class="btn btn-approve" onclick="approveSeller('${key}')">Setujui</button>` : 
                            `<span style="color:#22c55e; font-size:0.8rem; font-weight:bold; margin-right:10px;">AKTIF</span>`
                        }
                        <button class="btn btn-delete" onclick="deleteSeller('${key}')">Hapus</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } else {
            tableBody.innerHTML = '<tr><td colspan="4" class="empty-msg">Belum ada pendaftar baru.</td></tr>';
        }
    });

    // Fungsi Approve Seller
    window.approveSeller = (id) => {
        if(confirm("Izinkan toko ini untuk mulai berjualan?")) {
            update(ref(db, `registrations/${id}`), { status: 'approved' })
            .then(() => alert("Seller Berhasil Disetujui!"));
        }
    };

    // Fungsi Hapus Data
    window.deleteSeller = (id) => {
        if(confirm("Hapus data pendaftaran ini secara permanen?")) {
            remove(ref(db, `registrations/${id}`));
        }
    };
</script>

</body>
</html>
