<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Verifikasi Seller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen p-6 text-gray-100">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">Admin Control Center</h1>
                <p class="text-gray-400">Verifikasi pendaftaran seller baru secara real-time</p>
            </div>
            <div class="bg-gray-800 p-3 rounded-lg border border-gray-700">
                <span class="text-sm text-gray-400">Total Pending:</span>
                <span id="countPending" class="text-xl font-bold text-orange-400 ml-2">0</span>
            </div>
        </header>

        <!-- Tabel Monitoring -->
        <div class="bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
            <table class="w-full text-left">
                <thead class="bg-gray-700 text-gray-300 uppercase text-xs">
                    <tr>
                        <th class="px-6 py-4">Nama Toko</th>
                        <th class="px-6 py-4">Pemilik & WA</th>
                        <th class="px-6 py-4">Kategori</th>
                        <th class="px-6 py-4">Waktu Daftar</th>
                        <th class="px-6 py-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-700">
                    <!-- Data dari Firebase akan muncul di sini -->
                    <tr id="loadingRow">
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500 italic">
                            Sedang memuat data seller...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com";

        const firebaseConfig = {
          apiKey: "AIzaSyA75bdcfawOi957by8y_4-l4sJCCo6pF88",
          authDomain: "xrezzkystore-marketplace-83bc0.firebaseapp.com",
          databaseURL: "https://xrezzkystore-marketplace-83bc0-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "xrezzkystore-marketplace-83bc0",
          storageBucket: "xrezzkystore-marketplace-83bc0.firebasestorage.app",
          messagingSenderId: "604900856944",
          appId: "1:604900856944:web:c48c973da45214c68a10b5",
          measurementId: "G-7XG9V48HW0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tableBody = document.getElementById('tableBody');
        const countPending = document.getElementById('countPending');

        // Fungsi Load Data secara Real-time
        const sellerRef = ref(db, 'pendaftaran_seller');
        onValue(sellerRef, (snapshot) => {
            tableBody.innerHTML = "";
            let counter = 0;

            if (snapshot.exists()) {
                const data = snapshot.val();
                
                Object.keys(data).forEach(key => {
                    const seller = data[key];
                    
                    // Hanya tampilkan yang statusnya pending
                    if (seller.status === "pending") {
                        counter++;
                        const row = `
                            <tr class="hover:bg-gray-750 transition">
                                <td class="px-6 py-4 font-semibold text-white">${seller.namaToko}</td>
                                <td class="px-6 py-4 text-sm text-gray-400">
                                    ${seller.namaPemilik}<br>
                                    <span class="text-blue-400">${seller.noWA}</span>
                                </td>
                                <td class="px-6 py-4"><span class="bg-gray-900 px-3 py-1 rounded-full text-xs">${seller.kategori}</span></td>
                                <td class="px-6 py-4 text-xs text-gray-500">${seller.waktuDaftar}</td>
                                <td class="px-6 py-4 text-center space-x-2">
                                    <button onclick="updateStatus('${key}', 'active')" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm font-bold transition">Approve</button>
                                    <button onclick="hapusSeller('${key}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm font-bold transition">Reject</button>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    }
                });
            }

            countPending.innerText = counter;
            if (counter === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center text-gray-500 italic">Tidak ada pendaftaran seller baru.</td></tr>`;
            }
        });

        // Global functions agar bisa dipanggil dari atribut onclick
        window.updateStatus = (id, newStatus) => {
            if(confirm("Setujui seller ini untuk mulai berjualan?")) {
                update(ref(db, 'pendaftaran_seller/' + id), { status: newStatus })
                .then(() => alert("Seller berhasil di-Approve!"))
                .catch(err => alert("Error: " + err.message));
            }
        };

        window.hapusSeller = (id) => {
            if(confirm("Tolak dan hapus data pendaftaran ini?")) {
                remove(ref(db, 'pendaftaran_seller/' + id))
                .then(() => alert("Data berhasil dihapus."));
            }
        };
    </script>

    <style>
        .hover\:bg-gray-750:hover { background-color: #2d3748; }
    </style>
</body>
</html>
