<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; margin: 0; display: none; /* Sembunyikan semua body dulu */ }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        header { background: #0f172a; color: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; font-size: 0.8rem; text-transform: uppercase; color: #64748b; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .pending { background: #fef9c3; color: #854d0e; }
        .approved { background: #dcfce7; color: #166534; }
        .btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; font-size: 0.8rem; }
        .btn-ok { background: #22c55e; color: white; margin-right: 5px; }
        .btn-del { background: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 style="margin:0">🛡️ Control Center</h2>
        <button onclick="location.reload()" class="btn" style="background:#334155; color:white;">Refresh Data</button>
    </header>

    <table>
        <thead>
            <tr>
                <th>Toko</th>
                <th>Email</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="reg-list">
            </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // --- KEAMANAN TERSEMBUNYI ---
    const secretKey = "XREZZKY2026"; // GANTI INI DENGAN PASSWORD RAHASIA LU
    const login = prompt("System Authentication Required:");

    if (login !== secretKey) {
        document.body.innerHTML = "<h1 style='text-align:center; margin-top:100px;'>404 Not Found</h1>";
        document.body.style.display = "block";
    } else {
        document.body.style.display = "block";
        initAdmin();
    }

    function initAdmin() {
        const firebaseConfig = {
            apiKey: "AIzaSyA75bdcfawOi957by8y_4-l4sJCCo6pF88",
            authDomain: "xrezzkystore-marketplace-83bc0.firebaseapp.com",
            databaseURL: "https://xrezzkystore-marketplace-83bc0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "xrezzkystore-marketplace-83bc0",
            storageBucket: "xrezzkystore-marketplace-83bc0.firebasestorage.app",
            messagingSenderId: "604900856944",
            appId: "1:604900856944:web:c48c973da45214c68a10b5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const listArea = document.getElementById('reg-list');

        // Ambil Data Registrasi
        onValue(ref(db, 'registrations'), (snapshot) => {
            const data = snapshot.val();
            listArea.innerHTML = '';
            if (data) {
                Object.keys(data).forEach(key => {
                    const r = data[key];
                    listArea.innerHTML += `
                        <tr>
                            <td><strong>${r.storeName}</strong></td>
                            <td>${r.email}</td>
                            <td><span class="badge ${r.status}">${r.status}</span></td>
                            <td>
                                ${r.status === 'pending' ? `<button class="btn btn-ok" onclick="approve('${key}')">Approve</button>` : ''}
                                <button class="btn btn-del" onclick="hapus('${key}')">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                listArea.innerHTML = '<tr><td colspan="4" style="text-align:center">Kosong.</td></tr>';
            }
        });

        window.approve = (id) => {
            if(confirm("Approve seller ini?")) {
                update(ref(db, `registrations/${id}`), { status: 'approved' });
            }
        };

        window.hapus = (id) => {
            if(confirm("Hapus data ini?")) {
                remove(ref(db, `registrations/${id}`));
            }
        };
    }
</script>

</body>
</html>
