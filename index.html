<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xrezzky Store | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navbar Sederhana -->
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Xrezzky Store</h1>
            <div class="space-x-4 text-sm">
                <a href="index.html" class="hover:underline">Home</a>
                <a href="seller-dashboard.html" class="bg-orange-500 px-3 py-1 rounded shadow">Daftar Seller</a>
                <a href="admin-panel.html" class="opacity-70 hover:opacity-100">Admin</a>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="container mx-auto mt-10 p-6 text-center">
        <div class="bg-white p-10 rounded-2xl shadow-xl max-w-lg mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Selamat Datang!</h2>
            <p class="text-gray-600 mb-8">Klik tombol di bawah untuk mengetes apakah database Firebase kamu sudah aktif.</p>
            
            <button id="btnTest" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition-all active:scale-95">
                Cek Koneksi Database
            </button>

            <p id="statusMsg" class="mt-6 text-sm font-semibold text-gray-400 italic">Status: Menunggu perintah...</p>
        </div>
    </main>

    <!-- LOGIKA FIREBASE -->
    <script type="module">
        import { db, ref, set } from './firebase-config.js';

        const btn = document.getElementById('btnTest');
        const status = document.getElementById('statusMsg');

        btn.onclick = async () => {
            status.innerText = "⏳ Sedang mencoba menulis ke database...";
            status.className = "mt-6 text-sm font-semibold text-blue-500 animate-pulse";

            try {
                // Menulis data sederhana ke Firebase
                await set(ref(db, 'status_koneksi/'), {
                    user: "Pengunjung",
                    waktu: new Date().toLocaleString(),
                    status: "Aktif"
                });

                status.innerText = "✅ BERHASIL! Database Terhubung.";
                status.className = "mt-6 text-sm font-semibold text-green-600";
            } catch (error) {
                status.innerText = "❌ GAGAL: " + error.message;
                status.className = "mt-6 text-sm font-semibold text-red-600";
            }
        };
    </script>
</body>
</html>
